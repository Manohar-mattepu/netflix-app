apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netflix-deny-all
spec:
  podSelector:
    matchLabels:
      app: netflix
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
