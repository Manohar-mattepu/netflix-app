apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app-deployment
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
        - name: netflix-app
          image: docker.io/manoharmattepu/netflix-app:${IMAGE_TAG}
          ports:
            - containerPort: 3000
          imagePullPolicy: Always
